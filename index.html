<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nouchi 4 — 4 Images 1 Mot</title>
<style>
:root{
  --orange:#ff7a00;
  --orange2:#ff9f1c;
  --green:#087f5b;
  --dark:#101418;
  --dark2:#171d23;
  --card:#202830;
  --white:#ffffff;
  --muted:#aab4bd;
  --gold:#ffc928;
  --red:#ff4d5a;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top right,rgba(255,122,0,.16),transparent 30%),
    radial-gradient(circle at bottom left,rgba(8,127,91,.14),transparent 30%),
    var(--dark);
  color:var(--white);
  min-height:100vh;
}
button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}
.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:18px 16px 30px;
}
/* HEADER */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.logoIcon{
  width:44px;
  height:44px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  box-shadow:0 8px 25px rgba(255,122,0,.25);
}
.logoText{
  font-weight:900;
  font-size:18px;
  letter-spacing:-.5px;
}
.logoSub{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}
.coins{
  display:flex;
  align-items:center;
  gap:7px;
  background:#202830;
  border:1px solid #303a43;
  padding:9px 12px;
  border-radius:30px;
  font-weight:800;
}
.coin{
  width:21px;
  height:21px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffd84d,#eaa800);
  color:#7c5200;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}
/* HOME */
.hero{
  background:
    linear-gradient(145deg,rgba(255,122,0,.18),rgba(8,127,91,.08)),
    var(--card);
  border:1px solid #303a43;
  border-radius:27px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 18px 45px rgba(0,0,0,.2);
}
.flag{
  font-size:42px;
  margin-bottom:8px;
}
.hero h1{
  font-size:31px;
  font-weight:950;
  letter-spacing:-1.5px;
}
.hero p{
  color:var(--muted);
  margin-top:9px;
  line-height:1.45;
}
.play{
  width:100%;
  margin-top:24px;
  padding:17px;
  border-radius:17px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  color:white;
  font-size:17px;
  font-weight:900;
  box-shadow:0 12px 28px rgba(255,122,0,.24);
}
.play:active{
  transform:scale(.98);
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}
.stat{
  background:var(--card);
  border:1px solid #303a43;
  border-radius:18px;
  padding:15px;
}
.stat strong{
  display:block;
  font-size:22px;
}
.stat span{
  color:var(--muted);
  font-size:12px;
}
/* GAME */
.game{
  display:none;
}
.gameHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.back{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#202830;
  color:white;
  font-size:20px;
}
.level{
  text-align:center;
}
.level small{
  color:var(--muted);
  font-size:11px;
}
.level strong{
  display:block;
  font-size:16px;
}
/* DIFFICULTE */
.difficulty{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin:2px 0 13px;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}
.pepper{
  width:24px;
  height:24px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
/*
  Piments dessinés en CSS.
  Ils restent de vraies petites icônes graphiques,
  pas des emojis.
*/
.pepper::before{
  content:"";
  width:9px;
  height:18px;
  border-radius:70% 40% 70% 70%;
  transform:rotate(-28deg);
  display:block;
}
.pepper::after{
  content:"";
  position:absolute;
  width:7px;
  height:5px;
  top:1px;
  left:10px;
  border-radius:8px 8px 2px 2px;
  background:#16804f;
}
.pepper.green::before{
  background:#16a05d;
}
.pepper.orange::before{
  background:#ff8a00;
}
.pepper.red::before{
  background:#e9333f;
}
.difficulty.easy{
  color:#35c878;
}
.difficulty.medium{
  color:#ff9f1c;
}
.difficulty.hard{
  color:#ff4d5a;
}
.progress{
  height:6px;
  background:#2b343d;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:16px;
}
.progressBar{
  height:100%;
  width:10%;
  background:linear-gradient(90deg,var(--orange),var(--orange2));
  border-radius:20px;
  transition:.4s;
}
/* IMAGES */
.images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.imageCard{
  aspect-ratio:1/1;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  border:1px solid #39434c;
  background:#252e36;
}
.visual{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  background:#252e36;
}
.imageLabel{
  position:absolute;
  bottom:8px;
  left:8px;
  right:8px;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(6px);
  padding:6px;
  border-radius:9px;
  text-align:center;
  font-size:10px;
  color:#eee;
}
/* ANSWER */
.answerTitle{
  text-align:center;
  margin:18px 0 10px;
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
}
.answer{
  display:flex;
  justify-content:center;
  gap:7px;
  min-height:48px;
  flex-wrap:wrap;
}
.slot{
  width:40px;
  height:44px;
  border-radius:11px;
  background:#202830;
  border:2px solid #39434c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:18px;
}
.slot.filled{
  border-color:var(--orange);
  background:rgba(255,122,0,.12);
}
.slot.correct{
  border-color:var(--green);
  background:rgba(8,127,91,.22);
}
/* LETTERS */
.letters{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:15px;
}
.letter{
  width:43px;
  height:43px;
  border-radius:12px;
  background:#252e36;
  border:1px solid #39434c;
  color:white;
  font-size:16px;
  font-weight:900;
}
.letter:active{
  transform:scale(.94);
}
.letter.used{
  opacity:.2;
  pointer-events:none;
}
/* OUTILS */
.tools{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:16px;
}
.tool{
  background:#202830;
  border:1px solid #303a43;
  border-radius:16px;
  color:white;
  padding:12px 7px;
  font-weight:800;
  font-size:11px;
}
.tool span{
  display:block;
  font-size:18px;
  margin-bottom:3px;
}
.tool small{
  display:block;
  color:var(--gold);
  margin-top:3px;
}
/* MESSAGE */
.message{
  text-align:center;
  min-height:22px;
  margin-top:12px;
  font-size:13px;
  color:var(--muted);
}
/* WIN */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(8,11,14,.88);
  backdrop-filter:blur(10px);
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:22px;
}
.win{
  width:100%;
  max-width:420px;
  background:#202830;
  border:1px solid #39434c;
  border-radius:28px;
  padding:30px 22px;
  text-align:center;
  animation:pop .35s ease;
}
@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}
.trophy{
  font-size:60px;
}
.win h2{
  font-size:27px;
  margin-top:8px;
}
.reward{
  color:var(--gold);
  font-size:20px;
  font-weight:900;
  margin:12px 0 20px;
}
.next{
  width:100%;
  padding:16px;
  border-radius:15px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  color:white;
  font-weight:900;
  font-size:16px;
}
/* RESPONSIVE */
@media(max-width:360px){
  .slot{
    width:34px;
  }
  .letter{
    width:39px;
    height:39px;
  }
  .tools{
    grid-template-columns:1fr 1fr 1fr;
  }
}
</style>
</head>

  <section class="letters" id="letters"></section>
  <!-- OUTILS -->
  <div class="tools">
    <button class="tool" onclick="eraseLetter()">
      <span>⌫</span>
      Effacer
      <small>Gratuit</small>
    </button>
    <button class="tool" onclick="revealLetter()">

    </button>
    <button class="tool" onclick="removeLetters()">

    </button>
  </div>
  <div class="message" id="message"></div>
</main>
</div>
<!-- VICTOIRE -->
<div class="overlay" id="overlay">
  <div class="win">
    <div class="trophy">🏆</div>

      Bonne réponse !
    </p>

      +50 🪙
    </div>
    <button class="next" onclick="nextLevel()">
      NIVEAU SUIVANT →

  </div>
</div>
