<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ludo Son Ivoir 🇨🇮</title>

<style>

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}

body {

  font-family: Arial, sans-serif;

  background: #101827;

  color: white;

  text-align: center;

}

header {

  padding: 25px 10px;

  background: linear-gradient(90deg, #f58220 33%, white 33%, white 66%, #009e60 66%);

  color: #101827;

  font-weight: bold;

}

h1 {

  font-size: 30px;

}

header p {

  margin-top: 8px;

}

main {

  padding: 25px 12px;

}

h2 {

  margin-bottom: 15px;

}

button {

  border: none;

  border-radius: 12px;

  padding: 14px 22px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

  margin: 8px;

}

.start {

  background: #f58220;

  color: white;

}

.dice {

  background: white;

  color: #101827;

  font-size: 35px;

  width: 85px;

  height: 85px;

}

#board {

  display: grid;

  grid-template-columns: repeat(5, 1fr);

  grid-template-rows: repeat(5, 1fr);

  width: min(90vw, 390px);

  aspect-ratio: 1;

  margin: 25px auto;

  border: 5px solid white;

  border-radius: 8px;

  overflow: hidden;

  background: white;

}

.cell {

  border: 1px solid #cbd5e1;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 27px;

}

.orange { background: #f58220; }

.green { background: #009e60; }

.blue { background: #2474d2; }

.red { background: #e63946; }

.center { background: #facc15; color: #101827; }

#status {

  margin: 15px auto;

  font-size: 18px;

  line-height: 1.5;

}

footer {

  padding: 20px;

  color: #aab5c5;

  font-size: 13px;

}

</style>

</head>

<body>

<header>

  <h1>🎲 LUDO SON IVOIR 🇨🇮</h1>

  <p>Le jeu de Ludo aux couleurs de la Côte d'Ivoire</p>

</header>

<main>

  <h2>Bienvenue dans le jeu !</h2>

  <p>Prépare-toi à jouer avec tes amis.</p>

  <button class="start" onclick="startGame()">

    🎮 Commencer la partie

  </button>

  <div id="game" style="display:none;">

    <div id="board"></div>

    <h2>🎲 Lance le dé</h2>

    <button class="dice" onclick="rollDice()" id="dice">

      🎲

    </button>

    <div id="status">

      Clique sur le dé pour commencer.

    </div>

  </div>

</main>

<footer>

  Ludo Son Ivoir © 2026 — Fait avec 🇨🇮

</footer>

<script>

let currentPlayer = 0;

let started = false;

const players = [

  { name: "Orange", color: "orange", icon: "🟠" },

  { name: "Vert", color: "green", icon: "🟢" },

  { name: "Rouge", color: "red", icon: "🔴" },

  { name: "Bleu", color: "blue", icon: "🔵" }

];

function startGame() {

  document.getElementById("game").style.display = "block";

  document.querySelector(".start").style.display = "none";

  createBoard();

  document.getElementById("status").textContent =

    "Au tour du joueur Orange ! Lance le dé.";

  started = true;

}

function createBoard() {

  const board = document.getElementById("board");

  board.innerHTML = "";

  const colors = [

    "orange", "orange", "orange", "green", "green",

    "orange", "", "", "", "green",

    "orange", "", "center", "", "green",

    "red", "", "", "", "blue",

    "red", "red", "red", "blue", "blue"

  ];

  for (let i = 0; i < 25; i++) {

    const cell = document.createElement("div");

    cell.className = "cell " + (colors[i] || "");

    if (i === 12) {

      cell.textContent = "🇨🇮";

    }

    board.appendChild(cell);

  }

}

function rollDice() {

  if (!started) return;

  const result = Math.floor(Math.random() * 6) + 1;

  const faces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

  document.getElementById("dice").textContent = faces[result - 1];

  document.getElementById("status").textContent =

    "Le joueur " + players[currentPlayer].name +

    " a obtenu " + result + " !";

  currentPlayer = (currentPlayer + 1) % players.length;

  setTimeout(() => {

    document.getElementById("status").textContent +=

      "\nAu tour du joueur " + players[currentPlayer].name + ".";

  }, 500);

}

</script>

</body>

</html>
