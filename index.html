<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouchi 4 — 4 Images 1 Mot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f7f7f7;color:#222;min-height:100vh}
button{border:none;cursor:pointer}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
#home{background:linear-gradient(160deg,#ff7a00,#ff9d38);color:white;text-align:center;padding:40px 20px}
.logo{font-size:48px;margin-top:40px}
.game-title{font-size:38px;font-weight:900;margin-top:10px}
.subtitle{margin-top:10px;font-size:17px;opacity:.95}
.play-btn{margin-top:50px;background:white;color:#ff7200;font-size:22px;font-weight:900;padding:18px 45px;border-radius:50px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.play-btn:active{transform:scale(.96)}
.home-info{margin-top:35px;font-size:14px;opacity:.9}
#game{background:#f7f7f7;padding-bottom:30px}
.topbar{background:white;padding:15px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.level-title{font-size:18px;font-weight:900}
.coins{background:#fff4d6;color:#d78b00;padding:8px 13px;border-radius:20px;font-weight:900}
.progress-container{height:7px;background:#ddd}
.progress{height:100%;background:#ff7900;width:0%;transition:.3s}
.difficulty{text-align:center;margin:18px 0 5px;font-size:15px;font-weight:800}
.peppers{text-align:center;font-size:24px;letter-spacing:4px}
.images-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px;max-width:500px;margin:auto}
.image-card{background:white;height:145px;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.image-card img{width:100%;height:100%;display:block;object-fit:cover}
